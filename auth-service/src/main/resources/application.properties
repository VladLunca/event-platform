spring.application.name=auth-service

# DB - local: localhost, Docker: auth-db (din docker-compose)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeded admin (used by DataSeeder on first startup)
admin.email=${ADMIN_EMAIL:admin@platform.com}
admin.password=${ADMIN_PASSWORD:admin123}

# gRPC
spring.grpc.server.port=${GRPC_PORT:9090}
