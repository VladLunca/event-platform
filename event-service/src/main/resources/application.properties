spring.application.name=event-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:event_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:event_user}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.grpc.client.channels.auth-service.address=${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9090}
spring.grpc.client.channels.auth-service.negotiation-type=plaintext
