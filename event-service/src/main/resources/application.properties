spring.application.name=event-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:eventdb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:eventuser}
spring.datasource.password=${DB_PASSWORD:eventpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.grpc.client.channels.auth-service.address=static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9090}
spring.grpc.client.channels.auth-service.negotiation-type=plaintext

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
